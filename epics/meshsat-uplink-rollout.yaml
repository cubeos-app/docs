id: meshsat-uplink-rollout
title: Roll out meshsat-uplink/v1 across bridge + hub + android
youtrack_epic: IFRNLLEI01PRD-XXX  # TBD — open at first dispatch
description: |
  Coordinate the wire-protocol introduction across the 3 affected repos.
  meshsat-hub side (SOS trigger + protocol parsers) lands FIRST (cloud is
  the source of truth for protocol); meshsat bridge side then; meshsat-android
  pair-shell + directory-sync layers ride on top.

  Drift safeguard: contracts/meshsat-uplink-v1.yaml enforces the wire-format
  parity at validator level. This epic is the dispatch coordinator.

status: in-progress

